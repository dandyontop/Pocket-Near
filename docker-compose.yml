services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pocket_near
      POSTGRES_USER: pocket_near
      POSTGRES_PASSWORD: pocket_near
    ports:
      - "5432:5432"
    volumes:
      - pocket_near_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocket_near -d pocket_near"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pocket_near_pg:
